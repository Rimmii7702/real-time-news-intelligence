input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["entity-counts", "article-insights"]
    group_id => "news-intelligence-indexer"
    auto_offset_reset => "earliest"
    codec => json
    consumer_threads => 1
  }
}
filter {
  if [count] {
    mutate { convert => { "count" => "integer" } }
  }
  mutate {
    remove_field => ["@version", "host", "event", "log"]
  }
}
output {
  if [entity_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "entity-counts-current"
      action => "index"
      document_id => "%{entity_id}"
    }
  } else if [article_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "news-article-insights"
      action => "index"
      document_id => "%{article_id}"
    }
  }
}
